[package]
name = "one-for-all"
version = "0.1.0"
edition = "2024"
description = "CLI based command macro and orchestration tool"
license = "MIT"

[[bin]]
name = "ofa"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
